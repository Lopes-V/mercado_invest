name: Temporary Kraken public API test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      summary: ${{ steps.test.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Read public API only, without database credentials
        id: test
        run: python3 .github/scripts/kraken-public-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-public-api-test
          path: ${{ runner.temp }}/kraken-public-api-test.json
          retention-days: 3
  report:
    needs: probe
    if: always()
    name: ${{ needs.probe.outputs.summary || 'Kraken test did not finish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'See the probe summary and artifact for public API results.'
