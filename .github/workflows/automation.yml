name: investment-automation

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investment-automation
  cancel-in-progress: false

jobs:
  run-safe-automation:
    # Manual dispatch is a collection smoke test unless both production gates
    # are explicitly approved in Repository Variables.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SHADOW_MODE_ENABLED == 'true' || vars.PIPELINE_SIMULATION_ENABLED == 'true' || (vars.AUTOMATION_ENABLED == 'true' && vars.PRODUCTION_READY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      LOG_LEVEL: INFO

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      TELEGRAM_ALERT_CHAT_IDS: ${{ vars.TELEGRAM_ALERT_CHAT_IDS }}
      TELEGRAM_SUMMARY_ENABLED: ${{ vars.TELEGRAM_SUMMARY_ENABLED || 'true' }}
      TELEGRAM_SUMMARY_TOP_N: ${{ vars.TELEGRAM_SUMMARY_TOP_N || '5' }}
      TELEGRAM_DRY_RUN: ${{ vars.TELEGRAM_DRY_RUN || 'false' }}

      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      MARKET_QUOTES_ENABLED: 'true'
      MARKET_QUOTES_INTERVAL_SECONDS: '1800'
      MARKET_HISTORY_ENABLED: 'true'
      MARKET_HISTORY_INTERVAL_SECONDS: '86400'
      MARKET_HISTORY_LOOKBACK_DAYS: '30'
      MARKET_HISTORY_CANDLE_INTERVAL: '1d'

      AUTOMATED_PIPELINE_ENABLED: ${{ vars.PIPELINE_SIMULATION_ENABLED == 'true' || (vars.AUTOMATION_ENABLED == 'true' && vars.PRODUCTION_READY == 'true') }}
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
      PRODUCTION_READY: ${{ vars.PRODUCTION_READY || 'false' }}
      PIPELINE_SIMULATION_ENABLED: ${{ vars.PIPELINE_SIMULATION_ENABLED || 'false' }}
      DRY_RUN_ALLOW_AI: ${{ vars.DRY_RUN_ALLOW_AI || 'false' }}
      SHADOW_MODE_ENABLED: ${{ vars.SHADOW_MODE_ENABLED || 'false' }}
      SHADOW_POLICY_VERSION: ${{ vars.SHADOW_POLICY_VERSION }}
      SHADOW_INTERVAL_SECONDS: ${{ vars.SHADOW_INTERVAL_SECONDS || '1800' }}
      SHADOW_CANDLE_INTERVAL: ${{ vars.SHADOW_CANDLE_INTERVAL || '1d' }}
      SHADOW_LOOKBACK_DAYS: ${{ vars.SHADOW_LOOKBACK_DAYS || '30' }}
      SHADOW_ANALYSIS_PERIOD: ${{ vars.SHADOW_ANALYSIS_PERIOD || '14' }}
      # Calendar days, not a synthetic count of future candles.
      SHADOW_FORWARD_HORIZON_DAYS: ${{ vars.SHADOW_FORWARD_HORIZON_DAYS || '5' }}
      SHADOW_ROUND_TRIP_COST_BPS: ${{ vars.SHADOW_ROUND_TRIP_COST_BPS || '20' }}
      AUTOMATED_PIPELINE_INTERVAL_SECONDS: '1800'
      AUTOMATED_PIPELINE_PROVIDERS: ${{ vars.AUTOMATED_PIPELINE_PROVIDERS || 'brapi,twelve_data' }}
      AUTOMATED_PIPELINE_CANDLE_INTERVAL: '1d'
      AUTOMATED_PIPELINE_LOOKBACK_DAYS: '30'
      AUTOMATED_PIPELINE_ANALYSIS_PERIOD: '14'
      AUTOMATED_PIPELINE_REFERENCE_MAX_AGE_SECONDS: '345600'
      AUTOMATED_PIPELINE_PROMPT_VERSION: 'gemini-v1'

      OPPORTUNITY_POLICY_VERSION: ${{ vars.OPPORTUNITY_POLICY_VERSION }}

      ALERT_COOLDOWN_SECONDS: ${{ vars.ALERT_COOLDOWN_SECONDS || '86400' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - run: python -m app.run_once
