[project]
name = "investment-bot"
version = "0.1.0"
description = "Sistema pessoal automatizado de análise de investimentos"
requires-python = ">=3.12"
dependencies = [
    "supabase",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requer um ambiente Supabase remoto explicitamente habilitado",
    "market_data_integration: requer BRAPI e/ou Supabase remoto explicitamente habilitado",
]
